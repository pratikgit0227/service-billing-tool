<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://accounts.google.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://accounts.google.com; img-src 'self' data: blob: https://ympofqcmpsntrokpwrym.supabase.co; connect-src 'self' https://ympofqcmpsntrokpwrym.supabase.co https://www.googleapis.com https://accounts.google.com https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com https://accounts.google.com https://ympofqcmpsntrokpwrym.supabase.co; object-src 'none'; base-uri 'none'; form-action 'none'; worker-src 'self'; manifest-src 'self'">

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<title>Service Billing Tool</title>
<style>
:root{color-scheme:light;--bg:#f2f2f7;--card:#fff;--ink:#1c1c1e;--mut:#8e8e93;--line:rgba(60,60,67,.14);--pri:#007aff;--priInk:#fff;
--fill:rgba(118,118,128,.12);--priBg:rgba(0,122,255,.12);
--ok:#248a3d;--okBg:rgba(52,199,89,.16);--warn:#b25000;--warnBg:rgba(255,149,0,.18);--bad:#d70015;--badBg:rgba(255,59,48,.13);
--info:#3a3a8c;--infoBg:rgba(88,86,214,.13);--glass:rgba(249,249,249,.8);--shadow:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.05)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#000;--card:#1c1c1e;--ink:#f2f2f7;--mut:#98989d;--line:rgba(84,84,88,.6);--pri:#0a84ff;--priInk:#fff;
--fill:rgba(118,118,128,.24);--priBg:rgba(10,132,255,.22);
--ok:#30d158;--okBg:rgba(48,209,88,.2);--warn:#ff9f0a;--warnBg:rgba(255,159,10,.2);--bad:#ff453a;--badBg:rgba(255,69,58,.2);
--info:#9e9cff;--infoBg:rgba(94,92,230,.28);--glass:rgba(28,28,30,.78);--shadow:none}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#000;--card:#1c1c1e;--ink:#f2f2f7;--mut:#98989d;--line:rgba(84,84,88,.6);--pri:#0a84ff;--priInk:#fff;
--fill:rgba(118,118,128,.24);--priBg:rgba(10,132,255,.22);
--ok:#30d158;--okBg:rgba(48,209,88,.2);--warn:#ff9f0a;--warnBg:rgba(255,159,10,.2);--bad:#ff453a;--badBg:rgba(255,69,58,.2);
--info:#9e9cff;--infoBg:rgba(94,92,230,.28);--glass:rgba(28,28,30,.78);--shadow:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",system-ui,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:10px 20px;position:sticky;top:0;z-index:5;border-bottom:.5px solid var(--line)}
header::before{content:'';position:absolute;inset:0;z-index:-1;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px)}
header h1{font-size:17px;font-weight:700;margin:0 6px 0 0;letter-spacing:-.02em}
nav{display:flex;gap:2px;background:var(--fill);padding:2px;border-radius:9px}
nav button{background:none;border:0;padding:5px 14px;border-radius:7px;color:var(--ink);cursor:pointer;font:inherit;font-size:13px;font-weight:500;white-space:nowrap;transition:background .15s}
nav button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.14),0 0 0 .5px rgba(0,0,0,.04);font-weight:600}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) nav button.on{background:#636366}}
:root[data-theme="dark"] nav button.on{background:#636366}
.nb{display:inline-block;min-width:17px;padding:0 5px;margin-left:5px;border-radius:99px;background:#ff3b30;color:#fff;font-size:11px;font-weight:700;line-height:17px;text-align:center}
#tabbar{display:none;background:none;border:0}
.sp{flex:1}
.sw{position:relative;display:inline-flex;align-items:center;gap:7px;cursor:pointer;margin:0;font-size:13px;color:var(--mut);user-select:none}
.sw input{position:absolute;opacity:0;width:0;height:0}
.sw i{width:44px;height:26px;border-radius:99px;background:rgba(120,120,128,.32);position:relative;transition:background .2s;display:inline-block}
.sw i::after{content:'';position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.3);transition:transform .2s}
.sw input:checked+i{background:#34c759}
.sw input:checked+i::after{transform:translateX(18px)}
.sw input:focus-visible+i{box-shadow:0 0 0 3px rgba(0,122,255,.4)}
main{padding:20px;max-width:1400px;margin:0 auto}
.card{background:var(--card);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:14px}
.kpi .l{color:var(--mut);font-size:12px;font-weight:500}
.kpi .v{font-size:26px;font-weight:700;margin-top:2px;letter-spacing:-.03em}
.kpi.bad .v{color:var(--bad)}.kpi.ok .v{color:var(--ok)}.kpi.warn .v{color:var(--warn)}
.two{grid-template-columns:repeat(auto-fit,minmax(380px,1fr))}
h2{font-size:17px;font-weight:700;margin:0 0 10px;letter-spacing:-.02em}
h2.bad{color:var(--bad)}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 8px;border-bottom:.5px solid var(--line);vertical-align:top;white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
th{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--mut)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
td.w{white-space:normal;min-width:150px}
tr.click{cursor:pointer;transition:background .12s}tr.click:hover{background:var(--fill)}
.tw{overflow-x:auto}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600}
.b-Paid{background:var(--okBg);color:var(--ok)}
.b-Partial{background:var(--warnBg);color:var(--warn)}
.b-Pending{background:var(--infoBg);color:var(--info)}
.b-Overdue{background:var(--badBg);color:var(--bad)}
button.btn{background:var(--pri);color:var(--priInk);border:0;border-radius:10px;padding:8px 16px;font:inherit;font-weight:600;cursor:pointer;transition:opacity .12s,transform .12s}
button.btn:hover{opacity:.9}button.btn:active{opacity:.65;transform:scale(.98)}
button.btn:disabled{opacity:.45;cursor:default}
button.btn.sec{background:var(--priBg);color:var(--pri)}
button.btn.dng{background:var(--badBg);color:var(--bad)}
button.btn.sm{padding:5px 12px;font-size:13px;border-radius:8px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--fill);border:0;border-radius:10px;padding:9px 12px;width:100%;outline:none;transition:box-shadow .15s}
input:focus,select:focus,textarea:focus{box-shadow:0 0 0 3px rgba(0,122,255,.35)}
input[type=file]{padding:7px 10px}
label{display:block;font-size:12px;font-weight:500;color:var(--mut);margin:0 0 4px 2px}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.f .full{grid-column:1/-1}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:10px;margin-bottom:14px;align-items:end}
dialog{border:0;border-radius:18px;background:var(--card);color:var(--ink);padding:0;width:min(780px,94vw);max-height:92vh;box-shadow:0 24px 70px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(0,0,0,.32);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.dh{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-bottom:.5px solid var(--line);position:sticky;top:0;z-index:2;background:var(--glass);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.dh h3{margin:0;font-size:16px;font-weight:700}
.db{padding:18px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mut{color:var(--mut)}.sm{font-size:12px}
.hint{font-size:12px;color:var(--mut);margin:3px 0 0 2px}
.sum{display:flex;gap:22px;flex-wrap:wrap;margin:12px 0}
.sum div b{display:block;font-size:18px;font-weight:700;letter-spacing:-.02em;color:var(--ink)}
.empty{color:var(--mut);padding:14px 4px}
a.lnk{color:var(--pri);cursor:pointer;text-decoration:none}a.lnk:hover{text-decoration:underline}
code{background:var(--fill);padding:1px 6px;border-radius:6px}
/* to-do */
.todo{display:flex;align-items:center;gap:12px;padding:10px 2px;border-bottom:.5px solid var(--line);transition:opacity .25s}
.todo:last-child{border-bottom:0}
.chk{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid #c7c7cc;background:transparent;cursor:pointer;position:relative;padding:0;transition:background .18s,border-color .18s}
.chk:hover{border-color:var(--pri)}
.todo.done .chk{background:var(--pri);border-color:var(--pri)}
.todo.done .chk::after{content:'';position:absolute;left:6.5px;top:2.5px;width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.todo.done .tt{text-decoration:line-through;color:var(--mut)}
.todo.done{opacity:.7}
.tb{flex:1;min-width:0;cursor:pointer}
.tt{font-size:15px;overflow-wrap:anywhere}
.tt .hi{color:#ff3b30;font-weight:800}
.tm{display:flex;gap:6px;flex-wrap:wrap;margin-top:3px}
.chip{display:inline-block;padding:1px 9px;border-radius:99px;background:var(--fill);color:var(--mut);font-size:12px;font-weight:500}
.chip.bad{background:var(--badBg);color:var(--bad)}.chip.today{background:var(--warnBg);color:var(--warn)}.chip.inv{background:var(--priBg);color:var(--pri);cursor:pointer}
.x{flex:none;background:none;border:0;color:var(--mut);cursor:pointer;font-size:14px;padding:4px 8px;border-radius:8px;opacity:.5}
.x:hover{opacity:1;background:var(--badBg);color:var(--bad)}
.cal{flex:none;padding:4px 6px;border-radius:8px;text-decoration:none;opacity:.7;font-size:15px}.cal:hover{opacity:1;background:var(--priBg)}
.add{display:flex;gap:8px}
.add input{font-size:16px;padding:11px 14px}
.sug{display:flex;gap:10px;align-items:center;padding:8px 2px;border-bottom:.5px solid var(--line)}
.sug:last-of-type{border-bottom:0}
.sug .tt{flex:1;font-size:14px}
@media (max-width:700px){
 html,body{height:100%}
 body{display:flex;flex-direction:column;height:100vh;height:100dvh;min-height:0;overflow:hidden}
 header{position:relative;flex:none;padding:calc(10px + env(safe-area-inset-top)) 14px 10px}
 main{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:14px;width:100%}
 #nav{display:none!important}
 #tabbar{display:flex;flex:none;order:9;position:relative;z-index:50;justify-content:space-around;gap:0;padding:6px 8px calc(8px + env(safe-area-inset-bottom));background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);border-top:.5px solid var(--line);border-radius:0}
 #tabbar button{flex:1;padding:8px 2px;font-size:12px;border-radius:10px;background:none!important;box-shadow:none!important;color:var(--mut)}
 #tabbar button.on{color:var(--pri);font-weight:700}
 .two{grid-template-columns:1fr}
 dialog{width:100vw;max-width:100vw;margin:auto 0 0;border-radius:18px 18px 0 0;max-height:94vh}
 .kpi .v{font-size:22px}
}
table.led td,table.led th{padding:7px 8px}
@media (max-width:700px){#tabbar button{font-size:11px;padding:8px 0}}
@media print{
 header,#tabbar,.noprint,dialog,.sw{display:none!important}
 html,body{height:auto!important;overflow:visible!important;background:#fff!important;color:#000!important}
 body{display:block!important}
 main{overflow:visible!important;padding:0!important;max-width:none!important}
 .card{box-shadow:none!important;border:0!important;padding:0!important;background:#fff!important}
 .tw{overflow:visible!important}th,td{white-space:normal!important;color:#000!important}
 .mut{color:#444!important}
}
</style>
<script src="vendor/supabase.js"></script>
<script src="config.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
</head>
<body>
<header>
  <h1>Service Billing Tool</h1>
  <nav id="nav"></nav>
  <span class="sp"></span>
  <label class="sw" title="Dark mode">🌙<input type="checkbox" id="thm" aria-label="Dark mode"><i></i></label>
  <span id="tools" style="display:none;align-items:center;gap:10px;flex-wrap:wrap">
    <span id="stat" class="sm mut"></span><span id="who" class="sm mut"></span>
    <button class="btn sm" id="bRem" style="display:none;background:var(--badBg);color:var(--bad)"></button>
    <button class="btn sec sm" id="bSec">Security</button>
    <button class="btn sec sm" id="bExport">Export data</button>
    <button class="btn sec sm" id="bImport">Import data</button>
    <input type="file" id="fImport" accept="application/json" hidden>
    <button class="btn sec sm" id="bOut">Sign out</button>
    <button class="btn" id="bNew">+ New Invoice</button>
  </span>
</header>
<nav id="tabbar" aria-label="Main" style="display:none"></nav>
<main id="main"></main>
<dialog id="dlg"><div class="dh"><h3 id="dt"></h3><button class="btn sec sm" id="dClose">Close</button></div><div class="db" id="dbody"></div></dialog>

<script src="app.js"></script>
</body>
</html>
